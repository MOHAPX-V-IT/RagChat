name: ragchat
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ragchat}
      POSTGRES_USER: ${POSTGRES_USER:-ragchat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run setup first}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 15
    restart: unless-stopped
  rag-api:
    build: ./rag-service
    environment:
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?Run setup first}
      MODEL_PROVIDER: ${MODEL_PROVIDER:-mock}
      MODEL_ADAPTER_URL: ${MODEL_ADAPTER_URL:-}
      MODEL_API_KEY: ${MODEL_API_KEY:-}
      SEARCH_ADAPTER_URL: ${SEARCH_ADAPTER_URL:-}
      SEARCH_API_KEY: ${SEARCH_API_KEY:-}
      SPECIALIST_KEYWORDS: ${SPECIALIST_KEYWORDS:-}
      DATA_DIR: /app/data
    volumes: [rag_data:/app/data]
    healthcheck:
      test: [CMD, python, -c, 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8010/health")']
      interval: 15s
      timeout: 5s
      retries: 8
    restart: unless-stopped
  api:
    build: ./api
    environment:
      PORT: 3001
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:8088}
      DATABASE_URL: postgresql://${POSTGRES_USER:-ragchat}:${POSTGRES_PASSWORD:?Run setup first}@postgres:5432/${POSTGRES_DB:-ragchat}
      JWT_SECRET: ${JWT_SECRET:?Run setup first}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Set administrator email}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Run setup first}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?Run setup first}
      RAG_SERVICE_URL: http://rag-api:8010
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-noreply@example.test}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@example.test}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
    volumes: [api_data:/app/data]
    depends_on:
      postgres: {condition: service_healthy}
      rag-api: {condition: service_healthy}
    healthcheck:
      test: [CMD, wget, -qO-, 'http://127.0.0.1:3001/api/health']
      interval: 15s
      timeout: 8s
      retries: 8
    restart: unless-stopped
  web:
    build: ./web
    ports: ['127.0.0.1:${WEB_PORT:-8088}:80']
    depends_on:
      api: {condition: service_healthy}
    restart: unless-stopped
  caddy:
    image: caddy:2.10-alpine
    profiles: [production]
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set domain}
    ports: ['80:80', '443:443', '443:443/udp']
    volumes: ['./Caddyfile:/etc/caddy/Caddyfile:ro', 'caddy_data:/data', 'caddy_config:/config']
    depends_on: [web]
    restart: unless-stopped
volumes:
  postgres_data:
  rag_data:
  api_data:
  caddy_data:
  caddy_config:
